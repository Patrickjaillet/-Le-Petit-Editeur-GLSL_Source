[package]
name = "shadertoy_engine"
version = "0.1.13"
edition = "2021"

[lib]
name = "shadertoy_engine"
crate-type = ["cdylib"]

# Profil release par defaut : Cargo ne strip pas les symboles de debug et
# ne fait pas de LTO. Avec ~150 dependances (wgpu + sa chaine ash/naga/
# metal/gpu-descriptor...), la .pyd/.so produite embarque donc des
# symboles/metadonnees inutiles a l'execution. `strip = true` les retire ;
# `lto = true` + `codegen-units = 1` permettent en plus au linker
# d'eliminer du code mort inter-crates (temps de compilation plus long,
# sans impact sur le comportement runtime). `panic = "abort"` est
# delibraiment omis : le module est charge dans l'interpreteur Python via
# PyO3, et changer la strategie de panic changerait la facon dont un
# panic Rust remonte cote Python (actuellement converti en exception
# Python par PyO3 grace a l'unwinding).
[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
wgpu = { version = "0.20", features = ["glsl"] }
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
once_cell = "1.19"
